[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devmind-research-platform"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
devmind = "devmind.main:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
markers = ["docker: requires actual Docker", "postgres: requires a test PostgreSQL database"]

[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The PDF recipe embeds manuscript prose and URLs as string literals.
"research/paper_revision/build_paper.py" = ["E501"]
