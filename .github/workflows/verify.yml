name: Verify DevMind
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: devmind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devmind -d devmind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check web/app.js
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: docker build -f deploy/Dockerfile.control -t devmind-control:1 .
      - run: docker build -f deploy/Dockerfile.executor -t devmind-executor:1 .
      - run: python -m pytest -q --junitxml=test-results.xml
        env:
          DEVMIND_TEST_DOCKER: '1'
          DEVMIND_TEST_POSTGRES: postgresql+psycopg://devmind:ci-only-password@localhost:5432/devmind_test

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devmind-integration-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14
