services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: devmind
      POSTGRES_DB: devmind
      POSTGRES_PASSWORD: ${DEVMIND_DB_PASSWORD:?Set a database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind -d devmind"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
