# Run from the repository root with --env-file deploy/.env.
# The worker Docker socket is privileged: dedicate this host to trusted operators.
x-control: &control
  build:
    context: ..
    dockerfile: deploy/Dockerfile.control
  image: devmind-control:1
  environment: &environment
    DEVMIND_DATABASE: ${DEVMIND_DATABASE:?Set the URL-encoded database connection URL}
    DEVMIND_API_TOKEN: ${DEVMIND_API_TOKEN:?Set a private operator token}
    DEVMIND_PROJECTS: /config/projects.json
    DEVMIND_MODEL_URL: ${DEVMIND_MODEL_URL:?Set an HTTPS model endpoint}
    DEVMIND_MODEL: ${DEVMIND_MODEL:?Set the served model name}
    DEVMIND_MODEL_KEY: ${DEVMIND_MODEL_KEY:-}
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  restart: unless-stopped
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: devmind
      POSTGRES_DB: devmind
      POSTGRES_PASSWORD: ${DEVMIND_DB_PASSWORD:?Set a private database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U devmind -d devmind]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *control
    command: [init]
    restart: "no"
    depends_on:
      database: {condition: service_healthy}
    volumes:
      - ${DEVMIND_REGISTRY:?Absolute projects.json path}:/config/projects.json:ro
  api:
    <<: *control
    command: [serve, --host, 0.0.0.0]
    # API has neither repository mounts nor the Docker socket.
    ports: ["127.0.0.1:8090:8090"]
    volumes:
      - ${DEVMIND_REGISTRY}:/config/projects.json:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *control
    command: [worker]
    group_add: ["${DEVMIND_DOCKER_GID:?Set the Docker socket group ID}"]
    volumes:
      - ${DEVMIND_REGISTRY}:/config/projects.json:ro
      - ${DEVMIND_REPOSITORIES:?Absolute repository parent directory}:/repositories:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 180s
volumes:
  postgres-data:
